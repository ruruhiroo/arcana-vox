<title>ARCANA VOX 模型庫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Cinzel:wght@500&display=swap">
<style>
  /* 展示室: 上に回せる模型、下に品の棚。暗い一色の見た目(ゲームと同じ世界) */
  :root {
    --bg: #0c0907; --panel: #15100c; --edge: #3a2e20; --edge-hi: #8a6a3a;
    --gold: #d6b36a; --ink: #e8dcc4; --ink-dim: #9a8c74;
    --serif: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    --latin: 'Cinzel', 'Times New Roman', serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--serif); }
  .wrap { max-width: 980px; margin: 0 auto; padding-block: 14px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .2em; color: var(--gold); font-weight: 700; text-wrap: balance; }
  h1 small { display: block; font-family: var(--latin); font-size: 11px; letter-spacing: .5em; color: var(--ink-dim); font-weight: 500; margin-top: 2px; }
  .count { font-size: 12px; color: var(--ink-dim); letter-spacing: .1em; }
  .stage { position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: 62vh; max-width: 100%; border: 1px solid var(--edge); background: radial-gradient(circle at 50% 42%, #2a221a, #0a0705 72%); overflow: hidden; touch-action: none; }
  .stage canvas { display: block; width: 100%; height: 100%; filter: saturate(.74) sepia(.1) contrast(1.06); }
  .stage .hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--ink-dim); pointer-events: none; }
  .stage .load { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-dim); font-size: 14px; letter-spacing: .2em; }
  .info { display: grid; gap: 4px; min-width: 0; }
  .info .cat { font-size: 12px; color: var(--ink-dim); letter-spacing: .3em; }
  .info h2 { margin: 0; font-size: 22px; color: var(--ink); font-weight: 700; letter-spacing: .08em; }
  .info p { margin: 0; color: var(--ink-dim); font-size: 14px; line-height: 1.8; max-width: 62ch; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button { font: inherit; font-size: 14px; background: transparent; color: var(--ink-dim); border: 1px solid var(--edge); padding: 6px 12px; letter-spacing: .15em; cursor: pointer; }
  .tabs button[aria-pressed="true"] { color: var(--gold); border-color: var(--edge-hi); background: #1c150e; }
  .tabs button:focus-visible, .shelf button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .anims button { font-size: 13px; padding: 4px 10px; }
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
  .shelf button { font: inherit; display: grid; gap: 2px; justify-items: center; padding: 4px 2px 6px; background: radial-gradient(circle at 50% 40%, #241c15, #090605 75%); border: 1px solid var(--edge); color: var(--ink-dim); cursor: pointer; min-width: 0; }
  .shelf button[aria-pressed="true"] { border-color: var(--edge-hi); box-shadow: inset 0 0 14px rgba(214,179,106,.18); color: var(--gold); }
  .shelf img { width: 100%; max-width: 96px; aspect-ratio: 1; filter: saturate(.74) sepia(.1) contrast(1.06); }
  .shelf span { font-size: 11px; line-height: 1.3; text-align: center; overflow-wrap: anywhere; }
  footer { font-size: 12px; color: var(--ink-dim); line-height: 1.7; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>模型庫<small>ARCANA VOX</small></h1>
    <span class="count" id="count">読み込み中</span>
  </header>
  <div class="stage" id="stage">
    <div class="load" id="load">模型を読み込んでいます…</div>
    <div class="hint">指でなぞって回す ・ つまんで寄せる</div>
  </div>
  <div class="info">
    <span class="cat" id="cat"></span>
    <h2 id="name"></h2>
    <p id="desc"></p>
  </div>
  <div class="tabs anims" id="anims" role="group" aria-label="動き" hidden></div>
  <div class="tabs" id="tabs" role="group" aria-label="分類"></div>
  <div class="shelf" id="shelf"></div>
  <footer>詠唱迷宮 ARCANA VOX の道具・装備・魔物。Blender で作った模型を、ゲームと同じ光と色で見せています。魔物は動きも切り替えられます。</footer>
</div>

const FOES = {
  skeleton: ['骸骨兵', '錆びた剣を振るう骸骨。聖と雷に弱く、闇と氷は効きにくい。'],

const FOE_SRC = {}, FOE_ANIMS = {};

let mixer = null;
const clock = new THREE.Clock();
function loadFoe(t) {
  if (FOE_SRC[t]) return Promise.resolve();

const $ = id => document.getElementById(id);
const stage = $('stage');

const SRC = {};
let current = null, curKey = null, curCat = 'tool';

function prep(o) {
  o.traverse(m => {
    if (!m.isMesh) return;
    const mt = m.material = m.material.clone();
    mt.envMapIntensity = mt.metalness > 0.5 ? 1.1 : 0.35;
    if (mt.metalness > 0.75) mt.metalness = 0.75;
    if (mt.emissiveIntensity > 0.5) mt.emissiveIntensity *= 0.6;
    if (mt.transmission > 0) { mt.transmission = 0; mt.transparent = true; mt.opacity = 0.3; mt.depthWrite = false; mt.side = THREE.DoubleSide; }

}
function fitted(k) {
  const foe = k.startsWith('foe_');
  const o = foe ? SRC[k] : prep(SRC[k].clone(true)); o.position.set(0, 0, 0);

}
function resize() {
  const r = stage.getBoundingClientRect();

  cam.aspect = r.width / Math.max(1, r.height); cam.updateProjectionMatrix();
}
addEventListener('resize', resize);

function show(k) {
  if (k.startsWith('foe_') && !SRC[k]) { $('name').textContent = '読み込み中…'; loadFoe(k.slice(4)).then(() => show(k)); return; }

}

function shoot(k) {
  if (thumbs[k]) return thumbs[k];
  if (!shotR) {
    shotR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    shotR.setSize(160, 160, false); shotR.setPixelRatio(1);
    shotR.toneMapping = THREE.ACESFilmicToneMapping; shotR.toneMappingExposure = 1.3; shotR.outputEncoding = THREE.sRGBEncoding;
    shotCam = new THREE.PerspectiveCamera(26, 1, 0.1, 50); shotCam.position.set(0, 0.35, 3.4); shotCam.lookAt(0, 0, 0);
  }
  const o = fitted(k); scene.add(o); if (current) current.visible = false;
  shotR.render(scene, shotCam);
  scene.remove(o); if (current) current.visible = true;
  if (k === curKey && current) { scene.remove(current); current = fitted(k); scene.add(current); }
  return (thumbs[k] = shotR.domElement.toDataURL('image/png'));
}

function renderTabs() {
  $('tabs').innerHTML = CATS.map(([id, label]) => `<button type="button" id="tab-${id}" data-cat="${id}" aria-pressed="${id === curCat}">${label}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { curCat = b.dataset.cat; renderTabs(); renderShelf(); const first = Object.keys(ITEMS).find(k => ITEMS[k][0] === curCat); show(first); });
}
function renderShelf() {
  if (curCat === 'enemy') {
    const keys = Object.keys(FOES).map(t => 'foe_' + t);
    $('shelf').innerHTML = keys.map(k => `<button type="button" id="item-${k}" data-k="${k}" aria-pressed="${k === curKey}"><img alt="" src="${thumbs[k] || BLANK}"><span>${ITEMS[k][1]}</span></button>`).join('');
    $('shelf').querySelectorAll('button').forEach(b => b.onclick = () => show(b.dataset.k));
    (async () => { for (const k of keys) { if (thumbs[k]) continue; await loadFoe(k.slice(4)); if (!SRC[k]) continue; const wasCur = curKey === k; const url = shoot(k); if (wasCur && current) { scene.remove(current); current = fitted(k); scene.add(current); } const im = document.querySelector('#item-' + k + ' img'); if (im) im.src = url; } })();
    return;
  }
  const keys = Object.keys(ITEMS).filter(k => ITEMS[k][0] === curCat && SRC[k]);
  $('shelf').innerHTML = keys.map(k => `<button type="button" id="item-${k}" data-k="${k}" aria-pressed="${k === curKey}"><img alt="" src="${shoot(k)}"><span>${ITEMS[k][1]}</span></button>`).join('');
  $('shelf').querySelectorAll('button').forEach(b => b.onclick = () => show(b.dataset.k));
}

new THREE.GLTFLoader().load('items.json', g => {
  for (const o of g.scene.children) if (o.name.startsWith('item_')) SRC[o.name.slice(5)] = o;
  $('load').remove();
  $('count').textContent = `${Object.keys(SRC).length} 点`;
  resize(); renderTabs(); renderShelf(); show('ether');
}, undefined, () => { $('load').textContent = '模型を読み込めませんでした。再読み込みしてください。'; });

resize();
(function loop() { requestAnimationFrame(loop); const dt = clock.getDelta(); if (mixer) mixer.update(dt); controls.update(); renderer.render(scene, cam); })();
</script>
