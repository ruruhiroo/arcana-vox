<!doctype html><meta charset="utf-8"><title>hand test</title>
<style>html,body{margin:0;background:#15161a;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }</script>
<script type="module">
// 開発用: 一人称の手の形を確かめる試し台(ゲーム本体からは読み込まない)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as GM from './js/glbmodels.js';
import { makeFpHand, gripPose } from './js/fphand.js';
GM.GLB_TYPES.length = 0; GM.GLB_TYPES.push('fp-hand');
await GM.preloadModels();
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setSize(innerWidth, innerHeight); document.body.append(R.domElement);
R.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 10);
scene.add(new THREE.HemisphereLight(0xbfc8e0, 0x30261c, 1.4));
const key = new THREE.DirectionalLight(0xffe2b8, 3); key.position.set(-1, 2, 2); scene.add(key);
const hand = makeFpHand();
const pivot = new THREE.Group(); scene.add(pivot); pivot.add(hand.root);
const cyl = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.3, 32), new THREE.MeshStandardMaterial({ color: 0x4a6a9a, transparent: true, opacity: 0.6 })); pivot.add(cyl);
window.T = { THREE, hand, pivot, cyl, cam, gripPose,
  view(az = 0, el = 0.2, d = 0.6, ty = 0.05) { cam.position.set(Math.sin(az) * Math.cos(el) * d, ty + Math.sin(el) * d, Math.cos(az) * Math.cos(el) * d); cam.lookAt(0, ty, 0); R.render(scene, cam); },
  grip(Rr, opt) { // 縦の棒(半径 Rr)を、右から握る
    cyl.visible = true; cyl.scale.set(Rr, 1, Rr);
    const p = gripPose(hand, Rr, opt); hand.pose(p);
    const m = new THREE.Matrix4().makeBasis(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, -1), new THREE.Vector3(-1, 0, 0));
    hand.root.quaternion.setFromRotationMatrix(m); hand.root.position.set(Rr + 0.0135, -0.005, 0.066);
    return p; },
  flat() { cyl.visible = false; hand.root.quaternion.identity(); hand.root.position.set(0, 0, 0); hand.pose({}); },
};
T.flat(); T.view(0, 0.1, 0.7, 0.08);
</script>
